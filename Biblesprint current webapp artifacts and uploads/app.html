<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BibleSprint — Whole Bible Reading Plan</title>
<meta name="theme-color" content="#FFF8EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110E" media="(prefers-color-scheme: dark)">
<meta name="description" content="Read the whole Bible at your own pace — 1, 2, 3 or 4 sprints a day, Matthew to Malachi.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BibleSprint">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">

<link rel="manifest" href="/manifest.json">

<style>
:root {
  /* Brand wordmark gradient — unchanged */
  --grad-main: linear-gradient(90deg, #3B82F6 0%, #8B5CF6 50%, #F43F5E 100%);
  /* Default accent = coral. Switch to blue with [data-accent="blue"] (Settings → Appearance).
     --accent is used for accent TEXT on light backgrounds — must pass 4.5:1.
     --accent-dark is used as a BACKGROUND colour with white text on top — must pass 4.5:1.
     --accent-soft is used for soft fills (completed-sprint backgrounds, etc).
     Deepened from the original #F43F5E (only 3.5:1 as text, 3.7:1 as a white-text
     background — both fail AA) to #DC1A38, same rose-red family, 4.7-4.9:1 either way. */
  --accent: #DC1A38; --accent-dark: #BE123C; --accent-soft: #FFE4E6;
  --accent-on: #FFFFFF;  /* text/icon colour to use on top of --accent-dark backgrounds */
  --grad-action: linear-gradient(135deg, #DB2777 0%, #DC1A38 50%, #C2410C 100%);
  --coral: #DC1A38; --gold: #F59E0B; --violet: #8B5CF6; --mint: #10B981;
  --ok: #10B981; --warn: #F59E0B; --danger: #EF4444;
  --shadow: 0 1px 2px rgba(220,26,56,0.06), 0 6px 16px rgba(220,26,56,0.12);
  --radius: 14px; --radius-sm: 10px; --tap: 44px;
}
/* === Deep blue accent palette (light mode) ===
   White on #1E40AF = 8.6:1 (passes AAA) — buttons stay readable.
   #2563EB on white = 4.8:1 (passes AA) — accent text/headings stay readable. */
[data-accent="blue"] {
  --accent: #2563EB;
  --accent-dark: #1E40AF;
  --accent-soft: #DBEAFE;
  --accent-on: #FFFFFF;
  --grad-action: linear-gradient(135deg, #60A5FA 0%, #2563EB 50%, #1E40AF 100%);
  --shadow: 0 1px 2px rgba(37,99,235,0.06), 0 6px 16px rgba(37,99,235,0.12);
}
/* === Gold accent palette (light mode) ===
   Bright gold doesn't take white text — we use near-black on gold instead, which reads at ~12:1 (AAA).
   #B45309 on white = 5.1:1 (passes AA) — accent text on white stays readable. */
[data-accent="gold"] {
  --accent: #B45309;       /* deep gold — text-on-white at 5.1:1 */
  --accent-dark: #F59E0B;  /* bright gold — button background, dark text on top */
  --accent-soft: #FEF3C7;
  --accent-on: #1A1207;    /* near-black text on gold — 11.8:1 contrast */
  --grad-action: linear-gradient(135deg, #FBBF24 0%, #F59E0B 50%, #D97706 100%);
  --shadow: 0 1px 2px rgba(217,119,6,0.10), 0 6px 16px rgba(217,119,6,0.18);
}
/* Default = warm light theme. Matches the home page palette but warmer in the surfaces. */
:root, [data-theme="light"] {
  --bg: #FFF8EE;          /* warm cream */
  --card: #FFFFFF;
  --text: #2A1B14;        /* warm charcoal */
  --muted: #5C4F45;       /* deepened from #7A6E64 (4.7:1, barely passing) to 7.5:1 — hint text was hard to read */
  --line: #F0E5D6;
  --line-soft: #F8F1E5;
  --grad-soft: linear-gradient(135deg, #FFE9D6 0%, #FCE7F3 100%);
}
/* === Deep blue palette (dark mode) === */
[data-theme="dark"][data-accent="blue"] {
  --accent: #60A5FA;       /* lighter blue on dark bg — ~7.8:1 contrast */
  --accent-dark: #1E40AF;  /* deep blue button bg — white text passes 8.6:1 */
  --accent-soft: #1E3A8A;  /* deep navy soft-fill */
  --accent-on: #FFFFFF;
}

/* === Gold palette (dark mode) ===
   Bright gold (#FBBF24) on the dark bg reads at 11.5:1 — easy. Buttons stay bright gold with near-black text. */
[data-theme="dark"][data-accent="gold"] {
  --accent: #FBBF24;
  --accent-dark: #F59E0B;
  --accent-soft: #422006;
  --accent-on: #1A1207;
}

/* Dark theme — warm near-black for visual comfort */
[data-theme="dark"] {
  --bg: #14110E;
  --card: #1F1A15;
  --text: #F0E8DC;
  --muted: #A89E92;
  --line: #2E2823;
  --line-soft: #25201B;
  /* Lighter coral on dark — passes 7.4:1 contrast against the dark bg */
  --accent: #FB7185;
  /* --accent-dark stays the same in both themes — used as a button bg with white text on top.
     White on #BE123C = 6.5:1 (passes WCAG AA). */
  --accent-dark: #BE123C;
  --accent-soft: #4A0E1A;
  --accent-on: #FFFFFF;
  --grad-soft: linear-gradient(135deg, #4A0E1A 0%, #45221A 100%);
  --shadow: 0 1px 2px rgba(0,0,0,0.30), 0 6px 16px rgba(0,0,0,0.45);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  /* Mobile hardening: never scroll sideways, don't let iOS/Android inflate text,
     and keep pull-to-refresh/rubber-band from chaining into parent scroll. */
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}
button, input, textarea, select {
  font-family: inherit; font-size: inherit; color: inherit;
  /* font-size inherits 16px, which stops iOS Safari zooming in on focus.
     touch-action removes the 300ms tap delay + double-tap zoom on controls. */
  touch-action: manipulation;
}
/* Inputs must never render below 16px or iOS zooms the page on focus. */
input, textarea, select { font-size: max(16px, 1rem); }
a, button, .nav-tab, .sprint-tick, [role="button"] { touch-action: manipulation; }
/* 100dvh tracks the *visible* viewport on mobile (excludes the browser toolbar),
   so the app fills the screen without a scroll jump. 100vh kept as fallback. */
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }

.topbar {
  position: sticky; top: 0; z-index: 10; background: var(--card);
  border-bottom: 1px solid var(--line); padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; }
.logo-text {
  font-weight: 800; font-size: 19px; letter-spacing: -0.01em;
  background: var(--grad-main);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  white-space: nowrap;
}
.greet { font-size: 13px; color: var(--muted); font-weight: 600; }
.greet strong { color: var(--text); }
.profile-btn {
  background: transparent; border: 1px solid transparent; cursor: pointer;
  padding: 6px 10px; border-radius: 999px;
  font-size: 13px; color: var(--muted); font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
  min-height: 36px;
}
.profile-btn strong { color: var(--text); }
.profile-btn:hover { background: var(--line-soft); border-color: var(--line); color: var(--text); }
.profile-btn[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
.profile-menu {
  position: fixed;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 16px 36px rgba(0,0,0,0.18), 0 4px 8px rgba(0,0,0,0.06);
  padding: 6px;
  min-width: 180px;
  z-index: 50;
  display: flex; flex-direction: column; gap: 2px;
  animation: profile-menu-pop 0.12s ease-out;
}
@keyframes profile-menu-pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.profile-menu-item {
  display: inline-flex; align-items: center; gap: 10px;
  background: transparent; border: none; cursor: pointer;
  padding: 10px 12px; border-radius: 8px;
  font-size: 14px; font-weight: 600; color: var(--text);
  text-align: left; min-height: 40px;
  transition: background 0.12s, color 0.12s;
}
.profile-menu-item:hover { background: var(--accent-soft); color: var(--accent-dark); }
.profile-menu-item svg { color: var(--muted); flex-shrink: 0; }
.profile-menu-item:hover svg { color: var(--accent); }
.progress-chip {
  background: var(--accent-soft); color: var(--accent);
  font-weight: 700; font-size: 13px; padding: 6px 10px; border-radius: 999px;
}
.progress-wrap { background: var(--card); padding: 0 16px 12px; border-bottom: 1px solid var(--line); }
.progress-bar { height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--grad-main); transition: width 0.3s; }
.progress-stats { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.progress-stats strong { color: var(--text); font-weight: 700; }

.screen { padding: 16px; }
.hide { display: none !important; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.card h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
.card .subtitle { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.card .label {
  display: block; font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--accent); margin: 14px 0 6px;
}
.card .label:first-child { margin-top: 0; }

.day-hero { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.day-hero h1 { font-size: 32px; margin: 0; letter-spacing: -0.02em; color: var(--accent); font-weight: 800; }
.day-hero .of { color: var(--muted); font-weight: 500; font-size: 15px; margin-left: 4px; }
.day-hero .count { color: var(--muted); font-size: 13px; }
.day-theme { color: var(--muted); font-style: italic; margin: 4px 0 14px; }

.sprint {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  margin-bottom: 8px; background: var(--card); cursor: pointer; transition: all 0.15s;
  min-height: var(--tap); -webkit-user-select: none; user-select: none;
}
.sprint:hover { border-color: var(--accent); }
.sprint:active { transform: scale(0.99); }
.sprint.done { background: var(--accent-soft); border-color: var(--accent); }
.sprint-tick {
  width: 28px; height: 28px; min-width: 28px;
  border: 2px solid var(--line); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; background: var(--card);
}
/* Tick checkmark — colour depends on accent palette: white on coral/blue, near-black on gold */
.sprint.done .sprint-tick { background: var(--accent-dark); border-color: var(--accent-dark); color: var(--accent-on); }
.sprint-tick svg { opacity: 0; transition: opacity 0.15s; }
.sprint.done .sprint-tick svg { opacity: 1; }
.sprint-body { flex: 1; min-width: 0; }
.sprint-label { font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: 0.02em; }
.sprint.done .sprint-label { color: var(--accent); }
.sprint-text { font-size: 15px; margin-top: 1px; line-height: 1.35; word-wrap: break-word; }
.sprint-read {
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; min-width: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card); color: var(--accent);
  text-decoration: none; transition: all 0.15s;
  margin-left: 6px;
}
.sprint-read:hover { background: var(--accent-dark); color: var(--accent-on); border-color: var(--accent-dark); }
.sprint-read svg { width: 20px; height: 20px; }
.sprint.credited { background: repeating-linear-gradient(45deg, var(--accent-soft), var(--accent-soft) 8px, transparent 8px, transparent 12px); }
.sprint.credited.done { border-color: var(--accent); }
.credit-tag {
  display: inline-block; background: var(--warn); color: white;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 1px 5px; border-radius: 3px; margin-left: 4px;
}
.sprint.done .sprint-text {
  color: var(--muted); text-decoration: line-through;
  text-decoration-thickness: 1px; text-decoration-color: rgba(139,92,246,0.4);
}

.day-nav { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.day-nav button {
  flex: 1; min-width: 0; min-height: var(--tap);
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; transition: all 0.15s;
  font-size: 13px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.day-nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.day-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
.day-nav button.today { background: var(--accent-dark); color: var(--accent-on); border-color: var(--accent-dark); }

.encouragement {
  background: var(--accent-soft); color: var(--accent-dark);
  padding: 12px 14px; border-radius: var(--radius-sm);
  font-style: italic; margin-top: 12px; font-size: 15px; line-height: 1.4;
}
[data-theme="dark"] .encouragement { color: #E2C8F5; }

.journal-field { margin-top: 14px; }
.journal-field label {
  display: block; font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--accent); margin-bottom: 2px;
}
.journal-field .hint { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 6px; }
.journal-field textarea, .journal-field input[type="text"], .form-field input {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 12px; background: var(--card); color: var(--text);
  font-size: 16px; line-height: 1.45; resize: vertical; transition: border-color 0.15s;  /* 16px: stops iOS zooming on focus */
}
.journal-field textarea:focus, .journal-field input[type="text"]:focus, .form-field input:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.save-ind {
  font-size: 12px; font-style: italic; margin-top: 6px; height: 18px;
  color: var(--muted); opacity: 0; transition: opacity 0.3s, color 0.3s;
  display: inline-flex; align-items: center; gap: 4px;
}
.save-ind.on { opacity: 1; }
.save-ind.saving { color: var(--muted); }
.save-ind.saved { color: var(--ok); }
.save-ind.offline { color: var(--warn); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 10px 18px; border-radius: var(--radius-sm);
  font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--text);
  cursor: pointer; transition: all 0.15s; text-decoration: none;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
/* Primary action — uses --accent-dark so the foreground text/icon (--accent-on) passes contrast.
   Hover gets a stronger shadow rather than a hardcoded colour, so it works for any palette. */
.btn-primary { background: var(--accent-dark); color: var(--accent-on); border-color: var(--accent-dark); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.10); color: var(--accent-on); }
.btn-block { display: flex; width: 100%; }
.btn-danger:hover { border-color: var(--danger); color: var(--danger); }
.btn-danger-solid { background: var(--danger); color: white; border-color: var(--danger); }
.btn-danger-solid:hover { background: #A82020; border-color: #A82020; color: white; }

.overview-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  margin-bottom: 6px; background: var(--card); cursor: pointer; transition: all 0.15s;
  min-height: var(--tap);
}
.overview-item:hover { border-color: var(--accent); }
.overview-item.current { border-color: var(--accent); background: var(--accent-soft); }
.overview-item.done { opacity: 0.85; }
.overview-num { min-width: 44px; font-weight: 800; color: var(--accent); font-size: 17px; }
.overview-body { flex: 1; min-width: 0; }
.overview-range { font-size: 14px; font-weight: 600; }
.overview-theme { font-size: 12px; color: var(--muted); margin-top: 2px; }
.overview-dots { display: flex; gap: 3px; }
.overview-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.overview-dots span.filled { background: var(--accent); }

.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 560px; background: var(--card);
  border-top: 1px solid var(--line);
  display: flex; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 10;
}
.nav-tab {
  flex: 1; background: none; border: none; padding: 8px 4px;
  color: var(--muted); font-size: 11px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; border-radius: 10px; min-height: var(--tap);
}
.nav-tab.active { color: var(--accent); background: var(--accent-soft); }
.nav-tab svg { width: 22px; height: 22px; }

.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-bottom: 1px solid var(--line-soft); gap: 12px;
}
.setting-row:last-child { border-bottom: none; }
.setting-row .setting-label { font-weight: 600; font-size: 15px; }
.setting-row .setting-hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.setting-row input[type="date"], .setting-row input[type="time"], .setting-row input[type="text"] {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 8px 10px; background: var(--card); min-height: var(--tap);
}

/* Auth / onboarding pages */
.onboarding { max-width: 460px; margin: 30px auto; padding: 20px; }
.onboarding.center { text-align: center; }
.onboarding h1 {
  font-size: 38px; color: var(--accent); margin: 18px 0 4px;
  font-weight: 800; letter-spacing: -0.02em;
}
.onboarding h2 { font-size: 20px; margin: 0 0 14px; font-weight: 600; color: var(--text); }
.onboarding p { color: var(--muted); font-size: 15px; line-height: 1.5; }
.onboarding .hero-mark {
  display: block;
  margin: 0 auto 14px;
  font-size: 44px; font-weight: 900; letter-spacing: -0.025em;
  background: var(--grad-main);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  line-height: 1.05;
}
.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
.form-field .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.form-error { color: var(--danger); font-size: 14px; margin: 8px 0; min-height: 20px; }
.auth-switch { text-align: center; margin-top: 14px; font-size: 14px; color: var(--muted); }
.auth-switch a { color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none; }
.auth-switch a:hover { text-decoration: underline; }
.auth-check { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; font-size: 13px; color: var(--muted); }
.auth-check input { margin-top: 3px; }

/* Founder quote card on sign-up */
.founder-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 24px; margin: 18px 0;
  box-shadow: 0 4px 20px rgba(59,130,246,0.06);
  position: relative;
}
.founder-card::before {
  content: "\201C"; position: absolute; top: -10px; left: 16px;
  font-size: 64px; line-height: 1; color: var(--accent);
  font-family: Georgia, serif; font-weight: 900; pointer-events: none;
}
.founder-quote { font-size: 15px; line-height: 1.65; color: var(--text); margin: 0 0 16px; }
.founder-sig { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line-soft); padding-top: 14px; }
.founder-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--grad-main); color: white;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px;
}
.founder-name { font-weight: 700; font-size: 15px; }
.founder-role { color: var(--muted); font-size: 13px; }

/* How-it-works 3 steps (compact) */
.steps-compact { margin: 18px 0 10px; display: flex; flex-direction: column; gap: 10px; }
.step-compact { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.step-compact .step-num {
  width: 32px; height: 32px; border-radius: 8px; background: var(--accent-soft);
  color: var(--accent); font-weight: 800; font-size: 15px;
  display: flex; align-items: center; justify-content: center; min-width: 32px;
}
.step-compact strong { color: var(--text); display: block; font-size: 15px; }

/* Benefits list (compact) */
.benefits-compact { list-style: none; padding: 0; margin: 10px 0 18px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 14px; }
.benefits-compact li { display: flex; align-items: flex-start; gap: 8px; color: var(--text); }
.benefits-compact li::before {
  content: "\2714"; color: white; background: var(--mint); font-weight: 800;
  width: 18px; height: 18px; min-width: 18px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
  margin-top: 2px;
}
@media (max-width: 480px) {
  .benefits-compact { grid-template-columns: 1fr; }
}

.pace-options { margin-top: 16px; }
.pace-option {
  display: block; width: 100%; text-align: left;
  padding: 16px; margin-bottom: 10px;
  border: 1.5px solid var(--line); background: var(--card);
  border-radius: var(--radius); cursor: pointer; transition: all 0.15s;
}
.pace-option:hover { border-color: var(--accent); }
.pace-option.selected { border-color: var(--accent); background: var(--accent-soft); }
.pace-option .pace-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pace-option .pace-name { font-weight: 700; font-size: 17px; }
.pace-option .pace-big { font-size: 24px; font-weight: 800; color: var(--accent); }
.pace-option .pace-meta { color: var(--muted); font-size: 13px; margin-top: 6px; }

.finished-banner {
  background: var(--grad-main); color: white;
  padding: 26px 20px; border-radius: var(--radius); text-align: center; margin-bottom: 14px;
  box-shadow: 0 10px 30px rgba(139,92,246,0.30);
}
.finished-banner h2 { font-size: 30px; margin: 0 0 8px; font-weight: 800; }
.finished-banner .cnt { font-size: 14px; opacity: 0.92; }

.history-item {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 8px; background: var(--card);
}
.history-head { display: flex; justify-content: space-between; gap: 10px; }
.history-title { font-weight: 700; font-size: 15px; }
.history-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.history-body { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); display: none; }
.history-item.open .history-body { display: block; }
.history-entry { margin-bottom: 10px; }
.history-entry .dk { font-size: 12px; color: var(--accent); font-weight: 700; }
.history-entry p { margin: 2px 0 0; font-size: 14px; white-space: pre-wrap; }

.banner {
  background: var(--warn); color: white;
  padding: 10px 14px; font-size: 13px; font-weight: 600;
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
}
.banner a, .banner button {
  color: white; text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0;
  font-weight: 700;
}

.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg);
  padding: 10px 18px; border-radius: 999px;
  font-weight: 600; font-size: 14px;
  opacity: 0; pointer-events: none; transition: all 0.25s;
  z-index: 100; max-width: 90%; text-align: center;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal-bg {
  position: fixed; inset: 0; background: rgba(10,14,20,0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 50;
}
.modal {
  background: var(--card); border-radius: var(--radius);
  max-width: 440px; width: 100%; padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal h3 { margin: 0 0 6px; font-size: 19px; }
.modal p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.spinner {
  width: 20px; height: 20px; border: 2.5px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (min-width: 640px) { .screen { padding: 20px; } .card { padding: 22px; } }

/* ---- Floating "Save your progress" FAB (guests only) ---- */
.fab-save {
  position: fixed; right: 16px; bottom: 86px;
  z-index: 40;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 18px; min-height: 48px;
  /* Action gradient — coral by default, switches to blue when [data-accent="blue"] is set */
  background: var(--grad-action);
  color: white;
  border: none; border-radius: 999px;
  font-weight: 700; font-size: 14px; letter-spacing: 0.01em;
  box-shadow: 0 10px 28px rgba(220,26,56,0.40), 0 4px 8px rgba(194,65,12,0.20);
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  -webkit-tap-highlight-color: transparent;
  animation: fab-pop 0.45s cubic-bezier(.18,1.6,.4,1.0);
}
.fab-save:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(244,63,94,0.50), 0 6px 10px rgba(251,146,60,0.30); }
.fab-save:active { transform: translateY(0); }
.fab-save svg { width: 18px; height: 18px; }
.fab-save .fab-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #FCD34D;
  box-shadow: 0 0 0 0 rgba(252,211,77,0.7);
  animation: fab-pulse 1.6s infinite;
}
@keyframes fab-pulse { 0%{box-shadow:0 0 0 0 rgba(252,211,77,0.7);} 70%{box-shadow:0 0 0 8px rgba(252,211,77,0);} 100%{box-shadow:0 0 0 0 rgba(252,211,77,0);} }
@keyframes fab-pop { from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;} }
@media (max-width: 380px) { .fab-save .fab-label-long { display: none; } }
/* When the guest FAB is floating, reserve extra space at the foot of the page so
   the last action buttons can be scrolled clear of it instead of sitting under it. */
body.has-guest-fab .app { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
/* Secondary footer links: keep the small inline look but give them a finger-sized
   hit area (vertical padding cancelled by negative margin so layout doesn't shift). */
.foot-link { display: inline-block; padding: 8px 3px; margin: -8px 0; }
/* Compact keyword chips on the Search screen */
.search-chip { flex: 0 0 auto; padding: 8px 14px; min-height: 40px; font-size: 14px; text-transform: capitalize; }

/* Guest banner — gentle reminder above the bottom nav */
.guest-strip {
  background: var(--grad-soft); color: var(--text);
  padding: 10px 14px; font-size: 13px; font-weight: 600;
  border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; align-items: center; justify-content: space-between;
}
.guest-strip a { color: var(--accent-dark); font-weight: 700; cursor: pointer; }
[data-theme="dark"] .guest-strip { color: var(--text); }
[data-theme="dark"] .guest-strip a { color: #C4B5FD; }

/* Auth-screen back button */
.auth-back {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: none; color: var(--muted);
  font-weight: 600; font-size: 14px; cursor: pointer;
  padding: 6px 0; margin-bottom: 10px;
}
.auth-back:hover { color: var(--accent); }

/* Streak chip on Today + Overview */
.streak-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg, #FFE4B5 0%, #FFB088 100%);
  color: #6B2A14;
  font-weight: 700; font-size: 12px;
  padding: 3px 10px; border-radius: 999px;
  margin-left: 6px;
  box-shadow: 0 1px 2px rgba(220,90,30,0.18);
}
[data-theme="dark"] .streak-chip {
  background: linear-gradient(135deg, #4A2A14 0%, #6B3818 100%);
  color: #FFD9B0;
  box-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
/* Final-day badge — keeps the day header layout stable */
.final-badge {
  display: inline-block;
  background: var(--coral); color: white;
  font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
  padding: 3px 7px; border-radius: 4px;
  margin-left: 8px; vertical-align: middle;
}

/* History collapsible animation */
.history-body {
  max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out;
  margin-top: 0; padding-top: 0; border-top: none;
  display: block;       /* override the previous display:none rule */
}
.history-item.open .history-body {
  max-height: 4000px; transition: max-height 0.4s ease-in;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft);
}

/* Sprint label truncation safety on very narrow phones */
@media (max-width: 380px) {
  .sprint-label, .sprint-text { overflow-wrap: anywhere; word-break: break-word; }
  .day-hero h1 { font-size: 26px; }
}

/* Audio modal */
.audio-modal-bg { position: fixed; inset: 0; background: rgba(10,14,20,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 60; padding: 0; }
@media (min-width: 640px) { .audio-modal-bg { align-items: center; padding: 20px; } }
.audio-modal {
  background: var(--card); border-radius: 18px 18px 0 0;
  width: 100%; max-width: 480px; padding: 18px 18px 24px;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
  max-height: 80vh; overflow: auto;
}
@media (min-width: 640px) { .audio-modal { border-radius: 18px; } }
.audio-modal h3 { margin: 0 0 4px; font-size: 18px; }
.audio-modal p.hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.audio-chap-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.audio-chap {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px; border-radius: 10px;
  background: var(--accent-soft); color: var(--text);
  text-decoration: none; font-weight: 600; font-size: 15px;
  border: 1px solid var(--line);
  transition: transform 0.12s, border-color 0.12s;
}
.audio-chap:hover { border-color: var(--accent); transform: translateY(-1px); text-decoration: none; }
.audio-chap-inapp { cursor: pointer; }
.audio-chap-inapp.audio-chap-active { border-color: var(--accent); background: var(--card); box-shadow: 0 4px 16px rgba(139,92,246,0.18); }
.audio-chap-state { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
.audio-chap-inapp.audio-chap-active .play-ico { background: var(--coral); }
.audio-chap .play-ico {
  width: 28px; height: 28px; border-radius: 50%; background: var(--grad-main); color: white;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.audio-modal .actions { display: flex; gap: 8px; justify-content: flex-end; }

/* Listen button per sprint */
.sprint-listen {
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; min-width: 40px;
  border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--accent);
  cursor: pointer; transition: all 0.15s;
  margin-left: 4px;
}
.sprint-listen:hover { background: var(--accent-dark); color: var(--accent-on); border-color: var(--accent-dark); }
.sprint-listen svg { width: 20px; height: 20px; }

/* Sprint Circles in Settings */
.circle-card {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; background: var(--card);
  margin-bottom: 10px;
}
.circle-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.circle-name { font-weight: 700; font-size: 16px; }
.circle-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.circle-badge {
  display: inline-block; background: var(--accent-soft); color: var(--accent-dark);
  font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 4px; vertical-align: middle; margin-left: 4px;
}
.circle-members { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.circle-member {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  background: var(--bg);
}
.circle-member-name { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; }
.circle-member-stats { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--text); flex-wrap: wrap; justify-content: flex-end; }
.circle-remove {
  background: transparent; border: none; color: var(--muted); font-size: 18px;
  cursor: pointer; padding: 0 6px; line-height: 1; min-width: 28px; min-height: 28px;
  border-radius: 6px;
}
.circle-remove:hover { color: var(--danger); background: rgba(239,68,68,0.08); }
.circle-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.circle-actions .btn { flex: 1; min-width: 100px; }
.circle-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* Circle admin messages / announcements */
.circle-messages { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.circle-msg-label { font-size: 12px; font-weight: 800; letter-spacing: 0.04em; color: var(--accent-dark); text-transform: uppercase; margin-bottom: 6px; }
.circle-msg-empty { font-size: 13px; color: var(--muted); font-style: italic; }
.circle-msg {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; border-radius: 8px; background: var(--accent-soft);
  margin-bottom: 6px;
}
.circle-msg-body { flex: 1; min-width: 0; }
.circle-msg-text { font-size: 14px; color: var(--text); line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
.circle-msg-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* Today-screen circle pulse strip */
.circle-pulse {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 10px 14px; border-radius: 10px;
  background: var(--grad-soft); color: var(--text);
  font-size: 13px; line-height: 1.45;
  margin-bottom: 12px;
  border: 1px solid var(--line);
}
.circle-pulse strong { color: var(--accent-dark); }

/* Theme toggle in settings */
.theme-toggle { display: flex; gap: 6px; background: var(--line-soft); padding: 4px; border-radius: 999px; }
.theme-toggle button {
  flex: 1; padding: 8px 12px; border-radius: 999px; min-height: 40px;
  background: transparent; border: none; color: var(--muted);
  font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.theme-toggle button.active {
  background: var(--card); color: var(--accent);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
</style>

const TOTAL_CHAPTERS = 1189;
const SPRINT_SIZE = 7;

function idxToRef(idx, order) {
  const books = getBooks(order || planOrder());
  let cur = 0;
  for (const [book, n] of books) { if (idx < cur + n) return { book, chapter: idx - cur + 1 }; cur += n; }
  throw new Error('idx out of range: ' + idx);
}
function formatSprint(startIdx, endIdx, order) {
  const ord = order || planOrder();
  const books = getBooks(ord);
  const groups = []; let cur = null;
  for (let i = startIdx; i <= endIdx; i++) {
    const { book, chapter } = idxToRef(i, ord);
    if (!cur || cur.book !== book) { cur = { book, start: chapter, end: chapter }; groups.push(cur); }
    else cur.end = chapter;
  }
  return groups.map(g => {
    const b = books.find(x => x[0] === g.book);
    if (b[1] === 1) return g.book;
    if (g.start === g.end) return `${g.book} ${g.start}`;
    return `${g.book} ${g.start}\u2013${g.end}`;
  }).join(', ');
}
let _allSprints = null;
function allSprints(order) {
  const ord = order || planOrder();
  const out = [];
  for (let i = 0; i < TOTAL_CHAPTERS; i += SPRINT_SIZE) {
    const end = Math.min(i + SPRINT_SIZE - 1, TOTAL_CHAPTERS - 1);
    out.push({ startIdx: i, endIdx: end, chapters: end - i + 1, text: formatSprint(i, end, ord) });
  }
  return out;
}
function buildPlan(sprintsPerDay, order) {
  const all = allSprints(order);
  const days = [];
  for (let i = 0; i < all.length; i += sprintsPerDay) days.push(all.slice(i, i + sprintsPerDay));
  return days;
}
function paceMeta(n) {
  const days = buildPlan(n);
  return {
    sprintsPerDay: n, days: days.length, chaptersPerDay: n * 7,
    label: n === 1 ? 'Gentle' : n === 2 ? 'Steady' : n === 3 ? 'Brisk' : 'Sprint',
    weeks: (days.length / 7).toFixed(1),
  };
}
// Spreads already-completed sprints across as many days of a NEW plan as
// needed (instead of capping at one day and silently discarding the rest —
// the earlier behaviour when someone had more credit than one day's pace).
function buildCreditCompletion(totalCredit, sprintsPerDay, totalDays) {
  const completion = {}; const creditedByDay = {};
  let remaining = Math.max(0, totalCredit); let day = 1;
  while (remaining > 0 && day <= totalDays) {
    const n = Math.min(sprintsPerDay, remaining);
    completion[day] = new Array(sprintsPerDay).fill(false).map((_, i) => i < n);
    creditedByDay[day] = n;
    remaining -= n; day++;
  }
  return { completion, creditedByDay, actualCredited: Math.max(0, totalCredit) - remaining };
}

// a browser identify send-push-reminders.php as the legitimate sender when
// subscribing. The matching private key lives server-side only, in the PHP
// script, and is what actually signs outgoing pushes.
const VAPID_PUBLIC_KEY = 'BF-ZGoc5gaweSOKA5wz6d2XTJZGvD8ai3z_4fJj8VYpPJ1ybxob_0hNtEND9rbqDpqJwiTE4UNPBYb1LgyGXWRM';

function urlBase64ToUint8Array(base64String) {

  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');

// signed in — a guest has no server-reachable document to attach it to.
// Best-effort throughout: a failure here should never block the (already
// separately granted) permission from working for the tab-open local path.
async function subscribeToPush() {
  if (!pushSupported() || !currentUser) return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const json = sub.toJSON();
    const entry = { endpoint: json.endpoint, keys: json.keys, addedAt: new Date().toISOString() };
    const existing = state.pushSubscriptions || [];
    state.pushSubscriptions = [...existing.filter(s => s.endpoint !== entry.endpoint), entry];
    save();
    return true;
  } catch (e) { console.warn('Push subscribe failed:', e); return false; }
}
// Removes this browser's subscription locally and from Firestore (e.g. when
// the reader turns notifications back off from Settings).
async function unsubscribeFromPush() {
  if (!pushSupported()) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      state.pushSubscriptions = (state.pushSubscriptions || []).filter(s => s.endpoint !== endpoint);
      save();

  } catch (e) { console.warn('Push unsubscribe failed:', e); }

  const filesets = BIBLE_BRAIN_FILESETS[ver];
  if (!filesets) throw new Error(`No in-app audio for ${ver} yet \u2014 switching to Bible.is.`);
  const filesetId = _isNT(book) ? filesets.nt : filesets.ot;
  const bookCode = BOOK_CODES[book];
  if (!bookCode) throw new Error(`Unknown book: ${book}`);
  const cacheKey = `${filesetId}|${bookCode}|${chapter}`;
  if (_audioUrlCache.has(cacheKey)) return _audioUrlCache.get(cacheKey);
  const url = `${BIBLE_BRAIN_API}/bibles/filesets/${filesetId}/${bookCode}/${chapter}?v=4&key=${encodeURIComponent(BIBLE_BRAIN_KEY)}&type=audio`;
  const resp = await fetch(url, { method: 'GET' });
  if (!resp.ok) throw new Error(`Audio lookup failed (HTTP ${resp.status})`);
  const json = await resp.json();
  const data = json && json.data;
  if (!data || !data.length || !data[0].path) throw new Error('No audio file returned');
  const audioUrl = data[0].path;
  _audioUrlCache.set(cacheKey, audioUrl);
  return audioUrl;
}

function audioUrlForChapter(book, chapter) {

  const bibleId = BIBLEIS_VERSIONS[ver];

  if (!bibleId || !code) {
    // Fall back to Bible Gateway if we don't know this translation on Bible.is
    return bibleGatewayUrl(`${book} ${chapter}`);

let state = loadCache();
let currentUser = null;
let userDocUnsub = null;

// existing account this session" (where local progress could be silently
// lost) from an ordinary page-reload session restore (where it's expected
// and safe for cloud data to populate local state).
let pendingInteractiveSignIn = false;
// Keeps the day view auto-synced to openingDay() (progress-locked "today")
// across every data refresh — initial paint, Firestore hydration, and any
// later live-snapshot update. Firestore's own local cache can itself be

// isn't enough; this instead keeps following until the reader explicitly

// One-time migration for accounts that predate the activityDates streak log:
// seed a single entry from the old single-value lastActiveDate so their streak
// doesn't just vanish on the first load — it can only ever read back as 0 or 1
// (there's no history to reconstruct beyond the one date that was already
// stored), which can never exceed their preserved longestStreak. Guarded so a
// returning multi-device user never re-seeds over dates another device wrote.
function seedActivityDates(s) {
  if (s.lastActiveDate && Object.keys(s.activityDates || {}).length === 0) {
    s.activityDates = { [s.lastActiveDate]: true };

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    const merged = raw ? { ...structuredClone(defaultState), ...JSON.parse(raw) } : structuredClone(defaultState);
    // Migrations
    if (merged.audioSource === 'youversion') merged.audioSource = 'bibleis';                  // Old default, retired (pushed app downloads)
    if (merged.audioSource === 'inapp' && !inAppAudioEnabled()) merged.audioSource = 'bibleis'; // Picked in-app but key isn't live yet — fall back gracefully
    // Brand new users (no saved preference, no plan yet) get the best default for the current build

// True if the local (guest) state has any actual reading progress worth protecting —
// a ticked sprint or non-empty journal entry in the current run.
function hasLocalProgress(s) {
  if (!s || !s.currentPlan) return false;
  const comp = s.currentPlan.completion || {};
  if (Object.values(comp).some(arr => Array.isArray(arr) && arr.some(Boolean))) return true;
  const journal = s.currentPlan.journal || {};
  return Object.values(journal).some(j => j && Object.values(j).some(v => (v || '').trim().length > 0));

// Shown only when an interactive sign-in (not a routine session restore) would

function confirmGuestOverwrite() {
  return new Promise(resolve => {
    $('#modal-root').innerHTML = `
      <div class="modal-bg" id="modal-bg"><div class="modal">
        <h3>Keep this device's progress, or your account's?</h3>

        <div class="actions" style="flex-direction:column; gap:8px; align-items:stretch;">
          <button class="btn btn-primary" id="guestconflict-local">Keep this device's progress</button>
          <button class="btn" id="guestconflict-cloud">Use my account's saved progress</button>
        </div>

    $('#guestconflict-local').addEventListener('click', () => { $('#modal-root').innerHTML = ''; resolve('local'); });

async function hydrateFromFirestore(uid) {
  if (!db) return;
  const ref = doc(db, 'users', uid);
  try {
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const data = snap.data();
      const wasInteractiveSignIn = pendingInteractiveSignIn;
      pendingInteractiveSignIn = false;
      if (wasInteractiveSignIn && hasLocalProgress(state)) {
        const choice = await confirmGuestOverwrite();
        if (choice === 'local') {
          // Keep this device's guest progress and push it up instead of pulling cloud down.
          state = { ...state, name: (state.name || currentUser.displayName || '').trim(), email: currentUser.email || '' };
          await setDoc(ref, { ...state, updatedAt: new Date().toISOString() }, { merge: true });
          toast("Kept this device's progress and saved it to your account.");
        } else {
          state = seedActivityDates({ ...structuredClone(defaultState), ...data, tab: state.tab || 'today' });
        }
      } else {
        // Cloud is the source of truth for returning users — overwrite local cache.
        state = { ...structuredClone(defaultState), ...data, tab: state.tab || 'today' };
      }
    } else {
      // First-time sign-up — keep whatever progress the guest already had locally
      // and persist it to the cloud so nothing is lost.
      const guestState = state || structuredClone(defaultState);
      state = {
        ...guestState,
        name: (guestState.name || currentUser.displayName || '').trim(),
        email: currentUser.email || '',
      };
      await setDoc(ref, { ...state, createdAt: new Date().toISOString() }, { merge: true });
      toast('Progress saved to your account.');
    }
    cacheLocal();
    userDocUnsub?.();
    userDocUnsub = onSnapshot(ref, snap => {
      if (snap.metadata.hasPendingWrites) return;
      const data = snap.data();
      if (!data) return;
      state = { ...state, ...data };
      cacheLocal();
      if (!suppressRenderFromSnapshot) render();
    });
  } catch (e) { console.error('hydrate failed:', e); }
}

// Track whether the last cloud save failed so we can surface an "offline" hint

let lastCloudSaveFailedAt = 0;
const debouncedCloudSave = debounce(async () => {

  const { tab, viewDay, ...persistable } = state;
  try {
    suppressRenderFromSnapshot = true;
    await setDoc(doc(db, 'users', currentUser.uid), {
      ...persistable,
      email: currentUser.email || null,
      updatedAt: new Date().toISOString(),
    }, { merge: true });

    if (lastCloudSaveFailedAt) {

    }
  } catch (e) {

    const now = Date.now();
    if (now - lastCloudSaveFailedAt > 30000) {
      toast("Reading offline — your progress is safe on this device.");
    }
    lastCloudSaveFailedAt = now;

  }

// ============================================================
// SPRINT CIRCLES — small accountability groups (≤ 12 members)
// ============================================================
const CIRCLE_MAX_MEMBERS = 12;
const INVITE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L
const INVITE_LEN = 6;
function generateInviteCode() {
  let s = '';
  for (let i = 0; i < INVITE_LEN; i++) s += INVITE_ALPHABET[Math.floor(Math.random() * INVITE_ALPHABET.length)];
  return s;
}

// Live in-memory cache of full member lists for circles the user is in.
// Shape: { [circleId]: { meta: {name, createdBy, memberUids, ...}, members: [{uid, displayName, currentStreak, daysFullyDone, pace, lastActive, ...}] } }
const circleData = {};
const circleUnsubs = {};

// Snapshot of the signed-in user's status — cheap to compute, used for fan-out
function buildMyStatus() {
  const plan = state.currentPlan;
  const days = plan ? currentPlanDays() : null;
  const p = plan ? planProgress() : null;
  return {
    displayName: displayName(),
    pace: plan ? plan.pace : null,
    planTotalDays: days ? days.length : null,
    planStartDate: plan ? plan.startDate : null,
    daysFullyDone: p ? p.daysFullyDone : 0,
    currentDay: plan ? openingDay() : null,
    chaptersRead: p ? p.chaptersRead : 0,
    percent: p ? p.percent : 0,
    currentStreak: currentStreak(),
    longestStreak: state.longestStreak || 0,
    lifetimeCompletions: state.lifetimeCompletions || 0,
    lastActive: state.lastActiveDate || null,
    updatedAt: new Date().toISOString(),
  };
}

// Push the signed-in user's status to each circle they're a member of.
// Debounced because save() is called on every tick — we don't want to hammer Firestore.
const fanOutToCircles = debounce(async () => {
  if (!currentUser || !db) return;
  const list = state.circles || [];
  if (!list.length) return;
  const status = buildMyStatus();
  for (const c of list) {
    try {
      await setDoc(doc(db, 'circles', c.id, 'members', currentUser.uid), status, { merge: true });
    } catch (e) {
      // Silent — covered by the offline toast in the main save loop
      console.warn('circle status write failed for', c.id, e?.code || e?.message);
    }
  }
}, 1500);

// Subscribe to a circle's metadata + members so the UI is live.
function subscribeToCircle(circleId) {
  if (circleUnsubs[circleId]) return; // already subscribed
  if (!db) return;
  circleData[circleId] = circleData[circleId] || { meta: null, members: [], messages: [] };
  const metaUnsub = onSnapshot(doc(db, 'circles', circleId), snap => {
    if (snap.exists()) {
      circleData[circleId].meta = { id: circleId, ...snap.data() };
    } else {
      circleData[circleId].meta = null;
    }
    if (state.tab === 'today' || state.tab === 'settings') render();
  });
  const membersUnsub = onSnapshot(collection(db, 'circles', circleId, 'members'), snap => {
    circleData[circleId].members = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    if (state.tab === 'today' || state.tab === 'settings') render();
  });
  // Admin announcements — newest first (sorted client-side so no composite index is needed).
  const messagesUnsub = onSnapshot(collection(db, 'circles', circleId, 'messages'), snap => {
    circleData[circleId].messages = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    if (state.tab === 'today' || state.tab === 'settings') render();
  });
  circleUnsubs[circleId] = () => { metaUnsub(); membersUnsub(); messagesUnsub(); };
}
function unsubscribeFromAllCircles() {
  Object.values(circleUnsubs).forEach(fn => { try { fn(); } catch {} });
  for (const k of Object.keys(circleUnsubs)) delete circleUnsubs[k];
}
function syncCircleSubscriptions() {
  if (!currentUser) { unsubscribeFromAllCircles(); return; }
  const wanted = new Set((state.circles || []).map(c => c.id));
  // Drop subscriptions for circles the user has left
  for (const id of Object.keys(circleUnsubs)) {
    if (!wanted.has(id)) { try { circleUnsubs[id](); } catch {} delete circleUnsubs[id]; delete circleData[id]; }
  }
  // Subscribe to new ones
  for (const id of wanted) subscribeToCircle(id);
}

// ----- Circle actions -----
async function createCircle(name) {
  if (!currentUser || !db) throw new Error('You need to be signed in to create a circle.');
  const trimmed = (name || '').trim();
  if (!trimmed) throw new Error('Give your circle a short name.');
  if (trimmed.length > 40) throw new Error('Keep the name under 40 characters.');
  let stage = 'init';
  try {
    // Stage 1 — generate a unique invite code (32^6 ≈ 1B combos; retry a few times for the rare collision)
    stage = 'codeLookup';
    let code, codeRef, attempts = 0;
    while (attempts < 6) {
      code = generateInviteCode();
      codeRef = doc(db, 'inviteCodes', code);
      const existing = await getDoc(codeRef);
      if (!existing.exists()) break;
      attempts++;
    }
    if (attempts >= 6) throw new Error('Could not generate a unique code. Try again.');
    const circleRef = doc(collection(db, 'circles'));
    const now = new Date().toISOString();
    // Stage 2 — write the circle doc with the user as the sole initial member
    stage = 'circleWrite';
    await setDoc(circleRef, {
      name: trimmed,
      inviteCode: code,
      createdBy: currentUser.uid,
      createdAt: now,
      memberUids: [currentUser.uid],
    });
    // Stage 3 — write the invite-code lookup doc
    stage = 'codeWrite';
    await setDoc(codeRef, { circleId: circleRef.id, circleName: trimmed, createdAt: now });
    // Stage 4 — write the user's member status doc inside the circle
    stage = 'memberWrite';
    await setDoc(doc(db, 'circles', circleRef.id, 'members', currentUser.uid), buildMyStatus(), { merge: true });
    state.circles = [...(state.circles || []), { id: circleRef.id, name: trimmed, role: 'admin', joinedAt: now, inviteCode: code }];
    save();
    syncCircleSubscriptions();
    track('circle_created');
    console.info('[Sprint Circles] created', { id: circleRef.id, code, name: trimmed });
    return { id: circleRef.id, code, name: trimmed };
  } catch (e) {
    console.error('[Sprint Circles] create failed at stage:', stage, '— code:', e?.code || '(none)', '— message:', e?.message, e);
    logClientError('createCircle:' + stage, e);
    throw translateCircleError(e, 'Could not create circle.');
  }
}

async function joinCircleByCode(rawCode) {
  if (!currentUser || !db) throw new Error('You need to be signed in to join a circle.');
  const code = (rawCode || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, INVITE_LEN);
  if (code.length !== INVITE_LEN) throw new Error(`Invite codes are ${INVITE_LEN} characters.`);
  // 1. Look up the code → get the circleId. Anyone signed in can read inviteCodes.
  const codeRef = doc(db, 'inviteCodes', code);
  let codeSnap;
  try {
    codeSnap = await getDoc(codeRef);
  } catch (e) {
    throw translateCircleError(e, 'Could not look up that invite code.');
  }
  if (!codeSnap.exists()) throw new Error("That code doesn't match any circle.");
  const { circleId, circleName } = codeSnap.data();
  // 2. Already in this circle? Refresh local list rather than re-joining.
  if ((state.circles || []).some(c => c.id === circleId)) {
    throw new Error(`You're already in "${circleName}".`);
  }
  const circleRef = doc(db, 'circles', circleId);
  const now = new Date().toISOString();
  // 3. Add the user to memberUids via a plain update.
  //    arrayUnion is atomic so parallel joiners don't clobber each other.
  //    The 12-member cap is enforced server-side by the rules — see SETUP_CIRCLES.md.
  try {
    await updateDoc(circleRef, { memberUids: arrayUnion(currentUser.uid) });
  } catch (e) {
    throw translateCircleError(e, 'Could not join the circle.');
  }
  // 4. Now that we're a member, write our status to the members subcollection.
  try {
    await setDoc(doc(db, 'circles', circleId, 'members', currentUser.uid), buildMyStatus(), { merge: true });
  } catch (e) {
    // Non-fatal — the join itself succeeded. Status will sync on the next save().
    console.warn('member status write failed:', e?.code || e?.message);
  }
  state.circles = [...(state.circles || []), { id: circleId, name: circleName, role: 'member', joinedAt: now }];
  save();
  syncCircleSubscriptions();
  track('circle_joined');
  return { id: circleId, name: circleName };
}

// Translate Firestore errors into copy that points the user (or the admin) at the right fix.
function translateCircleError(e, fallback) {
  const code = e?.code || '';
  const msg = (e?.message || '').toLowerCase();
  if (code === 'permission-denied' || msg.includes('insufficient permissions')) {
    return new Error('Sprint Circles need a one-time Firebase rules update. Ask the app admin to follow SETUP_CIRCLES.md.');
  }
  if (code === 'unavailable' || msg.includes('offline')) {
    return new Error('You appear to be offline. Try again when you have a connection.');
  }
  if (code === 'invalid-argument' && msg.includes('member')) {
    return new Error(`This circle is full (${CIRCLE_MAX_MEMBERS} members max).`);
  }
  return new Error(fallback || (e?.message || 'Something went wrong.'));
}

async function leaveCircle(circleId) {
  if (!currentUser || !db) return;
  const meta = circleData[circleId]?.meta;
  // Admin leaving with other members: hand admin to the longest-tenured remaining member
  // (For v1 we just block — they can rename/remove first or delete the circle entirely.)
  if (meta && meta.createdBy === currentUser.uid && (meta.memberUids || []).length > 1) {
    throw new Error("You're the admin. Remove other members first, or delete the circle.");
  }
  try {
    await updateDoc(doc(db, 'circles', circleId), { memberUids: arrayRemove(currentUser.uid) });
    try { await deleteDoc(doc(db, 'circles', circleId, 'members', currentUser.uid)); } catch {}
  } catch (e) {
    throw translateCircleError(e, 'Could not leave circle.');
  }
  state.circles = (state.circles || []).filter(c => c.id !== circleId);
  save();
  syncCircleSubscriptions();
}

async function deleteCircle(circleId) {
  if (!currentUser || !db) return;
  const meta = circleData[circleId]?.meta;
  if (!meta) throw new Error("Couldn't find that circle.");
  if (meta.createdBy !== currentUser.uid) throw new Error('Only the admin can delete a circle.');
  try {
    for (const uid of (meta.memberUids || [])) {
      try { await deleteDoc(doc(db, 'circles', circleId, 'members', uid)); } catch {}
    }
    if (meta.inviteCode) {
      try { await deleteDoc(doc(db, 'inviteCodes', meta.inviteCode)); } catch {}
    }
    await deleteDoc(doc(db, 'circles', circleId));
  } catch (e) {
    throw translateCircleError(e, 'Could not delete circle.');
  }
  state.circles = (state.circles || []).filter(c => c.id !== circleId);
  save();
  syncCircleSubscriptions();
}

async function renameCircle(circleId, newName) {
  if (!currentUser || !db) return;
  const trimmed = (newName || '').trim();
  if (!trimmed) throw new Error('Give your circle a short name.');
  if (trimmed.length > 40) throw new Error('Keep the name under 40 characters.');
  try {
    await updateDoc(doc(db, 'circles', circleId), { name: trimmed });
  } catch (e) {
    throw translateCircleError(e, 'Could not rename circle.');
  }
  state.circles = (state.circles || []).map(c => c.id === circleId ? { ...c, name: trimmed } : c);
  save();
}

async function removeMemberFromCircle(circleId, uid) {
  if (!currentUser || !db) return;

    try { await deleteDoc(doc(db, 'circles', circleId, 'members', uid)); } catch {}
  } catch (e) {

}

// ----- Helpers -----
const $ = sel => document.querySelector(sel);
// Formats a Date as YYYY-MM-DD using the reader's LOCAL calendar date.
// Deliberately not toISOString() (always UTC) — a reader outside UTC would
// otherwise have "today" flip over hours before/after their real local
// midnight, silently breaking streaks and misfiling readings by day.
function localISO(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function todayISO() { return localISO(new Date()); }
function daysBetween(a, b) {
  const s = new Date(a + 'T00:00:00'), e = new Date(b + 'T00:00:00');
  return Math.floor((e - s) / 86400000);
}
function currentPlanDays() { return buildPlan(state.currentPlan.pace, state.currentPlan.readingOrder || 'mm'); }
function getCompletion(dayNum) {
  if (!state.currentPlan) return [];
  const days = currentPlanDays();
  const len = days[dayNum - 1]?.length || 0;
  const arr = state.currentPlan.completion?.[dayNum] || [];
  const out = new Array(len).fill(false);
  for (let i = 0; i < Math.min(arr.length, len); i++) out[i] = !!arr[i];
  return out;
}
// The reader's current day: the OLDEST day that isn't fully finished yet —
// not a calendar date. Falling behind never skips unread days, since "today"
// stays pinned to the day that actually needs finishing; catching up just
// means finishing old days rather than racing a separate "credit" counter.
// Deliberately derived from completion (not a stored field) so it can never
// drift out of sync with the ticks themselves.
function openingDay() {
  if (!state.currentPlan) return 1;
  const days = currentPlanDays();
  for (let n = 1; n <= days.length; n++) {
    const arr = getCompletion(n);
    const expected = days[n - 1]?.length || 0;
    const fullyDone = expected > 0 && arr.length >= expected && arr.slice(0, expected).every(Boolean);
    if (!fullyDone) return n;
  }
  return days.length;
}
function setCompletion(dayNum, idx, val) {
  const arr = [...getCompletion(dayNum)]; arr[idx] = val;
  state.currentPlan.completion = { ...(state.currentPlan.completion || {}), [dayNum]: arr };
  if (val) { markActivity(); track('sprint_completed', { pace: state.currentPlan.pace, day: dayNum }); }
  refreshLongestStreak();
  save();
}
function getJournal(dayNum) {
  return state.currentPlan?.journal?.[dayNum] || { verse: '', observations: '', application: '', prayer: '' };
}
function setJournal(dayNum, patch) {
  const cur = getJournal(dayNum);
  state.currentPlan.journal = { ...(state.currentPlan.journal || {}), [dayNum]: { ...cur, ...patch } };
  // Any non-empty journal change counts as activity
  const hasContent = Object.values(patch).some(v => (v || '').trim().length > 0);
  if (hasContent) markActivity();
  save();
}
// Record that the user did something today (ticking or journalling)
function markActivity() {
  state.lastActiveDate = todayISO();
  state.activityDates = { ...(state.activityDates || {}), [todayISO()]: true };
}
// A daily habit streak, independent of plan-day numbering: consecutive calendar
// days (walking back from today) on which the reader ticked a sprint or wrote a
// journal entry. Falls back to yesterday so the streak doesn't visually zero out
// the moment midnight passes before the reader has acted today.
function currentStreak() {
  const dates = state.activityDates || {};
  let cursor = new Date(todayISO() + 'T00:00:00');
  if (!dates[localISO(cursor)]) cursor.setDate(cursor.getDate() - 1);
  let count = 0;
  while (dates[localISO(cursor)]) {
    count++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return count;
}
function refreshLongestStreak() {
  const cur = currentStreak();
  if (cur > (state.longestStreak || 0)) state.longestStreak = cur;
}
function planProgress() {
  if (!state.currentPlan) return { percent: 0, sprintsDone: 0, totalSprints: 0, chaptersRead: 0, daysFullyDone: 0 };
  const days = currentPlanDays();
  let sDone = 0, sTotal = 0, cRead = 0, dDone = 0;
  for (let i = 0; i < days.length; i++) {
    const s = days[i]; const done = state.currentPlan.completion?.[i + 1] || [];
    sTotal += s.length; let dayComplete = s.length > 0;
    for (let j = 0; j < s.length; j++) {
      if (done[j]) { sDone++; cRead += s[j].chapters; } else dayComplete = false;
    }
    if (dayComplete) dDone++;
  }
  return { percent: Math.round((cRead / 1189) * 100), sprintsDone: sDone, totalSprints: sTotal, chaptersRead: cRead, daysFullyDone: dDone };
}
function isPlanFinished() {
  const p = planProgress();
  return p.sprintsDone === p.totalSprints && p.totalSprints > 0;
}
function dayRangeText(sprints) {
  const first = sprints[0].text.split(',')[0].trim();
  const last = sprints[sprints.length - 1].text.split(',').pop().trim();
  return first === last ? first : `${first} \u2192 ${last}`;
}
function displayName() { return (state.name || currentUser?.displayName || 'friend').trim() || 'friend'; }

function render() {
  clearModals();
  // Setup-required screen only if BOTH Firebase isn't configured AND there's no existing local data
  // (so a guest can still use the app even without a backend, just without cloud sync).
  if (!isConfigured && !state.currentPlan && !localStorage.getItem(CACHE_KEY)) {
    renderSetupNeeded();
    return;
  }
  // Auth screen only when explicitly requested (via the floating Save button or signed-out & user opened it)
  if (authVisible && !currentUser) {

  // manually navigates away — see followingToday's declaration for why this
  // can't just be a one-time "first paint" check.
  if (followingToday) {
    state.viewDay = openingDay();

  renderBanner(); renderTopbar(); renderProgress(); renderNav(); renderMain();
  renderFAB();
}

async function submitAuth() {

    } else if (authMode === 'signin') {

      err.textContent = `If an account exists for ${email}, a reset link has been sent. Check your inbox (and spam folder).`;
      btn.disabled = false; btn.innerHTML = origText;

    }
  } catch (e) {

}
function friendlyAuthError(e) {

    'auth/user-disabled': 'This account has been disabled.',
    'auth/user-not-found': 'No account found with that email.',

}

function tomorrowISO() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  return localISO(d);
}

// Push the current plan onto the history archive and bump the lifetime count.
// Used both by the finish-banner buttons and by "cancel plan" when the plan was
// actually completed, so a finished read-through is never silently lost.
function archiveCurrentPlan() {
  if (!state.currentPlan) return false;
  const entry = {
    completedAt: new Date().toISOString(),
    startedAt: state.currentPlan.startDate,
    pace: state.currentPlan.pace,
    days: state.currentPlan.journal || {},
  };
  state.archive = [entry, ...(state.archive || [])];
  state.lifetimeCompletions = (state.lifetimeCompletions || 0) + 1;
  track('bible_completed', { pace: state.currentPlan.pace, lifetime_count: state.lifetimeCompletions });
  return true;
}

function archiveAndContinue(mode) {
  if (!state.currentPlan) return;
  // Archive the completed plan
  archiveCurrentPlan();

  // Figure out pending setup for the NEXT plan
  const finalDayIdx = currentPlanDays().length - 1;
  const finalSprintCount = currentPlanDays()[finalDayIdx]?.length || 0;
  state.pendingCreditReason = 'finished';
  if (mode === 'continue-today') {
    state.pendingStartDate = todayISO();
    state.pendingCredit = finalSprintCount; // credit today's sprints from the just-completed plan
  } else if (mode === 'rest-today') {
    state.pendingStartDate = tomorrowISO();
    state.pendingCredit = 0;
  } else { // 'fresh-today'
    state.pendingStartDate = todayISO();
    state.pendingCredit = 0;
  }

  // Clear current plan
  state.currentPlan = null;
  state.viewDay = 1;
  state.tab = 'today';
  save(); render();
  const msg = mode === 'continue-today'
    ? `Bible #${state.lifetimeCompletions} archived. Pick a pace \u2014 ${finalSprintCount} sprint${finalSprintCount===1?'':'s'} will be credited.`
    : mode === 'rest-today'
      ? `Bible #${state.lifetimeCompletions} archived. Enjoy the rest \u2014 Day 1 begins tomorrow.`
      : `Bible #${state.lifetimeCompletions} archived. Starting fresh today.`;
  toast(msg);
}

// Non-destructive mid-run pace/order change: unlike cancelling, this keeps
// every sprint already read (carried into the new plan as credit, spread
// across as many days as it takes) and keeps the outgoing run's journal —
// stashed in state.pausedRuns, visible in History — instead of deleting it.
function pauseAndChangePaceFlow() {
  const plan = state.currentPlan;
  if (!plan) return;
  const comp = plan.completion || {};
  const sprintsCompleted = Object.values(comp).reduce((n, arr) => n + (Array.isArray(arr) ? arr.filter(Boolean).length : 0), 0);
  const hasJournal = Object.values(plan.journal || {}).some(j => j && Object.values(j).some(v => (v || '').trim().length > 0));
  $('#modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>Change pace?</h3>
      <p>${sprintsCompleted > 0
        ? `You've read ${sprintsCompleted} sprint${sprintsCompleted===1?'':'s'} on this run — that carries straight over to your new pace, no re-reading.`
        : `You haven't ticked anything on this run yet, so there's nothing to carry over.`}
      ${hasJournal ? ` This run's journal is kept — you'll find it under History as a paused run.` : ''}</p>
      <div class="actions" style="flex-direction:column; gap:8px; align-items:stretch;">
        <button class="btn" id="pause-export">📤 Export journal first</button>
        <div style="display:flex; gap:8px;">
          <button class="btn" id="pause-back" style="flex:1;">Back</button>
          <button class="btn btn-primary" id="pause-confirm" style="flex:1;">Choose new pace</button>
        </div>
      </div>
    </div></div>`;
  const close = () => $('#modal-root').innerHTML = '';
  $('#pause-back').addEventListener('click', close);
  $('#modal-bg').addEventListener('click', e => { if (e.target.id === 'modal-bg') close(); });
  $('#pause-export').addEventListener('click', () => { exportJournal(); });
  $('#pause-confirm').addEventListener('click', () => {
    close();
    if (sprintsCompleted > 0 || hasJournal) {
      state.pausedRuns = [{
        pausedAt: new Date().toISOString(),
        startedAt: plan.startDate,
        pace: plan.pace,
        readingOrder: plan.readingOrder,
        days: plan.journal || {},
        sprintsCompleted,
      }, ...(state.pausedRuns || [])];
    }
    state.pendingCreditReason = 'paused';
    state.pendingStartDate = todayISO();
    state.pendingCredit = sprintsCompleted;
    state.currentPlan = null;
    state.viewDay = 1;
    save(); render();
    toast(sprintsCompleted > 0
      ? `Paused. ${sprintsCompleted} sprint${sprintsCompleted===1?'':'s'} will carry over — pick a new pace.`
      : 'Pick a new pace when you’re ready.');
  });
}

// ----- History -----
// Shared by completed-Bible archive entries and paused-run entries — renders
// each day's journal (verse/observations/application/prayer) that has content.
function renderJournalEntries(days) {
  const entries = Object.keys(days || {}).sort((x, y) => +x - +y);
  return entries.map(d => {
    const j = days[d] || {}; const parts = [];
    if (j.verse) parts.push(`<div class="history-entry"><div class="dk">Key verse</div><p>${escapeHtml(j.verse)}</p></div>`);
    if (j.observations) parts.push(`<div class="history-entry"><div class="dk">Observations</div><p>${escapeHtml(j.observations)}</p></div>`);
    if (j.application) parts.push(`<div class="history-entry"><div class="dk">Application</div><p>${escapeHtml(j.application)}</p></div>`);
    if (j.prayer) parts.push(`<div class="history-entry"><div class="dk">Prayer</div><p>${escapeHtml(j.prayer)}</p></div>`);
    return parts.length ? `<div style="margin-top:12px; padding:10px 0; border-top:1px solid var(--line-soft);"><div style="font-weight:700; font-size:13px; color:var(--accent);">Day ${d}</div>${parts.join('')}</div>` : '';
  }).filter(Boolean).join('');
}
function renderHistory() {
  const archive = state.archive || []; const life = state.lifetimeCompletions || 0;
  const pausedRuns = state.pausedRuns || [];
  let body;
  if (archive.length === 0) {
    body = `<div class="card">
      <span class="label">History</span>
      <p style="margin:0; color:var(--muted);">No completed plans yet. When you finish a read-through, it's saved here. Already read the whole Bible before? Log it below.</p>
      <p style="margin-top:10px; color:var(--muted); font-size:14px;">Lifetime Bibles completed: <strong>${life}</strong></p>
      <button class="btn btn-primary" id="history-add" style="margin-top:14px;">+ Log a completed Bible</button>
    </div>`;
  } else {
    const items = archive.map((a, idx) => {
      const runNum = life - idx;
      // Manually-logged completions have no pace/journal — show a simpler line.
      const metaLine = (a.manual || a.pace == null)
        ? `Logged read-through · completed ${formatDate(a.completedAt)}`
        : `${paceMeta(a.pace).label} (${a.pace}/day) · ${formatDate(a.startedAt)} → ${formatDate(a.completedAt)}`;
      const body = renderJournalEntries(a.days);
      return `
        <div class="history-item" data-idx="${idx}">
          <div class="history-head">
            <div>
              <div class="history-title">Bible #${runNum}</div>
              <div class="history-meta">${metaLine}</div>
            </div>
            ${body ? `<button class="btn" data-toggle="${idx}">View</button>` : ''}
          </div>
          <div class="history-body">
            ${body || '<p style="color:var(--muted); font-style:italic;">No journal entries recorded for this plan.</p>'}
          </div>
        </div>`;
    }).join('');
    body = `<div class="card">
      <span class="label">History</span>
      <p style="margin:0 0 10px; color:var(--muted); font-size:14px;">Lifetime Bibles completed: <strong>${life}</strong></p>
      ${items}
      <button class="btn" id="history-add" style="margin-top:14px;">+ Log a completed Bible</button>
    </div>`;
  }
  // Paused runs — set aside by a mid-run pace change (pauseAndChangePaceFlow).
  // Kept separate from completed Bibles since they don't count toward the
  // lifetime total, but the journal and progress made are still visible here.
  const pausedBody = pausedRuns.length === 0 ? '' : `<div class="card">
      <span class="label">Paused runs</span>
      <p style="margin:0 0 10px; color:var(--muted); font-size:14px;">Runs you switched pace away from mid-read. Nothing here counts toward your lifetime Bible count — it's just kept so the journal isn't lost.</p>
      ${pausedRuns.map((p, idx) => {
        const metaLine = `${paceMeta(p.pace).label} (${p.pace}/day) · ${formatDate(p.startedAt)} → paused ${formatDate(p.pausedAt)} · ${p.sprintsCompleted} sprint${p.sprintsCompleted===1?'':'s'} read`;
        const body = renderJournalEntries(p.days);
        return `
        <div class="history-item" data-idx="${idx}">
          <div class="history-head">
            <div>
              <div class="history-title">Paused run</div>
              <div class="history-meta">${metaLine}</div>
            </div>
            ${body ? `<button class="btn" data-ptoggle="${idx}">View</button>` : ''}
          </div>
          <div class="history-body">
            ${body || '<p style="color:var(--muted); font-style:italic;">No journal entries recorded for this run.</p>'}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  $('#main').innerHTML = `<div class="screen">${body}${pausedBody}</div>`;
  // Scoped to the enclosing .card so the archive and paused-runs sections
  // (each with their own 0-based data-idx) never toggle each other's items.
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.dataset.toggle;
      const item = btn.closest('.card').querySelector(`.history-item[data-idx="${idx}"]`);
      item.classList.toggle('open');
      btn.textContent = item.classList.contains('open') ? 'Hide' : 'View';
    });
  });
  document.querySelectorAll('[data-ptoggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.dataset.ptoggle;
      const item = btn.closest('.card').querySelector(`.history-item[data-idx="${idx}"]`);
      item.classList.toggle('open');
      btn.textContent = item.classList.contains('open') ? 'Hide' : 'View';
    });
  });
  $('#history-add')?.addEventListener('click', promptLogCompletion);
}

// Manually record a Bible the user read without ticking sprints, so their
// real completions show up in History and their lifetime count is accurate.
function promptLogCompletion() {
  $('#modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>Log a completed Bible</h3>
      <p>Read the whole Bible without ticking each sprint? Add it here so your History and lifetime count are accurate.</p>
      <div class="form-field"><label for="log-date">When did you finish?</label>
        <input type="date" id="log-date" max="${todayISO()}" value="${todayISO()}" aria-label="Completion date"></div>
      <div class="form-error" id="log-err"></div>
      <div class="actions">
        <button class="btn" id="log-cancel">Cancel</button>
        <button class="btn btn-primary" id="log-ok">Add to History</button>
      </div>
    </div></div>`;
  const close = () => $('#modal-root').innerHTML = '';
  $('#log-cancel').addEventListener('click', close);
  $('#modal-bg').addEventListener('click', e => { if (e.target.id === 'modal-bg') close(); });
  $('#log-ok').addEventListener('click', () => {
    const dateVal = $('#log-date').value;
    const err = $('#log-err');
    if (!dateVal) { err.textContent = 'Please pick the date you finished.'; return; }
    if (dateVal > todayISO()) { err.textContent = "That date is in the future."; return; }
    // ISO timestamp at local-noon so the date displays correctly across time zones.
    const entry = { completedAt: dateVal + 'T12:00:00.000Z', startedAt: null, pace: null, days: {}, manual: true };
    state.archive = [entry, ...(state.archive || [])];
    state.lifetimeCompletions = (state.lifetimeCompletions || 0) + 1;
    save();
    close(); render();
    toast(`Logged. That's Bible #${state.lifetimeCompletions} in your History.`);
  });
  setTimeout(() => $('#log-date')?.focus(), 50);
}

// Today-screen circle activity strip — shows the most recent partner activity
function renderCirclePulse() {
  if (!currentUser || !(state.circles || []).length) return '';
  // Gather all partner activity across circles, dedupe by uid (a person may be in multiple of yours)
  const seen = new Map();
  for (const c of state.circles) {
    const members = circleData[c.id]?.members || [];
    for (const m of members) {
      if (m.uid === currentUser.uid) continue;
      const prev = seen.get(m.uid);
      if (!prev || (m.lastActive && (!prev.lastActive || m.lastActive > prev.lastActive))) {
        seen.set(m.uid, { ...m, circleName: c.name });
      }
    }
  }
  const partners = Array.from(seen.values());
  if (partners.length === 0) return '';
  // Sort: active today → active yesterday → recent → unknown
  const today = todayISO();
  partners.sort((a, b) => {
    const at = a.lastActive || ''; const bt = b.lastActive || '';
    if (at && bt) return bt.localeCompare(at);
    if (at) return -1; if (bt) return 1; return 0;
  });
  const activeToday = partners.filter(p => p.lastActive === today);
  const top = (activeToday.length ? activeToday : partners).slice(0, 3);
  let line;
  if (activeToday.length === 0) {
    const p = top[0];
    line = `${escapeHtml(p.displayName || 'A partner')} last read ${formatRelativeDate(p.lastActive)}.`;
  } else if (activeToday.length === 1) {
    const p = top[0];
    const detail = p.currentStreak ? `${p.currentStreak}-day streak` : (p.currentDay ? `Day ${p.currentDay}` : 'reading');
    line = `<strong>${escapeHtml(p.displayName || 'A partner')}</strong> is reading today — ${detail}.`;
  } else {
    const names = top.map(p => `<strong>${escapeHtml(p.displayName || 'A partner')}</strong>`).join(', ').replace(/, ([^,]*)$/, ' and $1');
    const more = activeToday.length > 3 ? ` and ${activeToday.length - 3} more` : '';
    line = `${names}${more} are reading today.`;
  }
  return `
    <div class="circle-pulse" role="note">
      <span style="font-size:18px;" aria-hidden="true">👥</span>
      <span style="flex:1; min-width:0;">${line}</span>
    </div>`;
}
