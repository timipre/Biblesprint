function renderCirclesSettingsBody() {
  if (!currentUser) {
    return `
      <p style="margin:0 0 10px; color:var(--muted); font-size:14px; line-height:1.5;">
        Read alongside friends and family. Each Sprint Circle holds up to ${CIRCLE_MAX_MEMBERS} members
        — you'll see each other's day count and streak. Journals stay private to you.
      </p>
      <p style="margin:0 0 10px; color:var(--muted); font-size:13px;">Sign up to create or join a circle.</p>
      <button class="btn btn-primary" id="circle-signup-cta">Create a free account</button>`;
  }
  const myCircles = state.circles || [];
  const list = myCircles.length === 0 ? `
    <p style="margin:0 0 12px; color:var(--muted); font-size:14px; line-height:1.5;">
      Read alongside friends and family. Up to ${CIRCLE_MAX_MEMBERS} people can join one circle, and you can be in as many circles as you like.
      You'll see each other's day count and streak — journals stay private.
    </p>` : myCircles.map(c => {
      const data = circleData[c.id];
      const meta = data?.meta;
      const members = (data?.members || []).slice().sort((a, b) => (b.currentStreak || 0) - (a.currentStreak || 0));
      const youMember = members.find(m => m.uid === currentUser.uid);
      const memberRows = members.length === 0 ? `<div style="font-size:13px; color:var(--muted);">Loading members…</div>` : members.map(m => {
        const isYou = m.uid === currentUser.uid;
        const lastActive = m.lastActive ? formatRelativeDate(m.lastActive) : '—';
        const streakLine = (m.currentStreak || 0) > 0 ? `🔥 ${m.currentStreak}d` : '';

// Lightweight relative-date formatter for circle activity rows
function formatRelativeDate(iso) {
  if (!iso) return '';
  try {
    const then = new Date(iso); const now = new Date();
    const diff = (now - then) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if (diff < 86400*7) return Math.floor(diff/86400) + 'd ago';
    return then.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
  } catch { return ''; }
}

function shareDay(day) {
  const days = currentPlanDays(); const sprints = days[day - 1];
  const total = sprints.reduce((a, s) => a + s.chapters, 0);
  const isFinal = day === days.length;
  // Use a generic (no-name) encouragement for shared posts
  const genericEnc = ENC_POOL[(day - 1) % ENC_POOL.length] || 'One chapter at a time.';
  const lines = [
    `\uD83D\uDCD6 BIBLE SPRINT \u2014 Day ${day} of ${days.length}${isFinal?' (Final)':''}`, '',
    ...sprints.map((s, i) => `Sprint ${i+1}: ${s.text}`), '',
    `Today: ${total} chapters \u00b7 ${sprints.length} sprint${sprints.length===1?'':'s'}`, '',
    `\uD83D\uDD25 ${genericEnc}`, '',
    '\u2705 Reply DONE after each sprint', '',
    'https://www.biblesprint.com',
  ];
  const text = lines.join('\n');

}
// Share via the OS share sheet if available, otherwise fall back to clipboard.
// Distinguish user cancellation (do nothing — they aborted on purpose) from real errors (fall back to clipboard with a toast).
function shareOrCopy({ title, text, copyHint }) {
  const hint = copyHint || 'Copied — paste to share';
  if (!navigator.share) { copyToClipboard(text, hint); return; }
  navigator.share({ title, text }).catch(err => {
    const name = err && (err.name || '');
    // AbortError (Web Share spec) and "canceled"/"cancelled" (Safari) mean the user closed the sheet.
    if (name === 'AbortError' || /cancel/i.test(String(err))) return;
    copyToClipboard(text, hint);
  });
}
function copyToClipboard(text, hint) {
  const msg = hint || 'Copied \u2014 paste to share';
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => toast(msg)); return; }
  const ta = document.createElement('textarea'); ta.value = text;
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg); } catch {}
  document.body.removeChild(ta);
}

function shareJournal(day) {
  if (!state.currentPlan) return;
  const j = getJournal(day);
  const has = j.verse || j.observations || j.application || j.prayer;
  if (!has) { toast("Add a note first \u2014 nothing to share yet"); return; }
  const name = displayName();
  const parts = [];
  if (j.verse)        parts.push(j.verse.trim());
  if (j.observations) parts.push(j.observations.trim());
  if (j.application)  parts.push(j.application.trim());
  if (j.prayer)       parts.push(j.prayer.trim());
  const body = parts.join('\n\n');
  const text = `Day ${day}\n\n${body}\n\n\u2014 ${name}`;
  shareOrCopy({ title: `Day ${day} reflection`, text, copyHint: 'Copied \u2014 paste into your message' });
}

function exportJournal() {

function downloadFile(name, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let reminderTimer = null;
// Finds whichever reminder slot fires next — today if its time hasn't passed
// yet, otherwise that same slot tomorrow. Each slot maps 1:1 to a sprint
// index within the day (reminderTimes[i] reminds about sprint i).
function nextReminderSlot() {
  const times = state.currentPlan?.reminderTimes; if (!times || !times.length) return null;
  const now = new Date(); let best = null;
  times.forEach((t, i) => {
    if (!t) return;
    const [h, m] = t.split(':').map(Number);
    const target = new Date(); target.setHours(h, m, 0, 0);
    if (target <= now) target.setDate(target.getDate() + 1);
    if (!best || target < best.target) best = { target, index: i };
  });
  return best;
}
function scheduleReminder() {
  if (reminderTimer) { clearTimeout(reminderTimer); reminderTimer = null; }
  const next = nextReminderSlot(); if (!next) return;
  reminderTimer = setTimeout(() => { fireReminder(next.index); scheduleReminder(); }, next.target - new Date());
}
function fireReminder(slotIndex) {
  if (!state.currentPlan) return;
  const d = openingDay(); const done = getCompletion(d); const name = displayName();
  if (done[slotIndex]) return; // that sprint's already read — nothing to nudge about
  const doneCount = done.filter(Boolean).length;
  const body = doneCount >= done.length
    ? `${name}, Day ${d} is done. Peek at tomorrow?`
    : `${name}, Day ${d} is waiting. ${doneCount}/${done.length} sprints done.`;
  try {
    if ('Notification' in window && Notification.permission === 'granted') new Notification('BibleSprint', { body, tag: 'bss-daily' });
    else toast(body);
  } catch { toast(body); }
}

// ----- Modal -----
function confirmModal({ title, body, confirmLabel = 'Confirm', cancelLabel = 'Cancel', destructive = false, onConfirm }) {
  $('#modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>${escapeHtml(title)}</h3><p>${escapeHtml(body)}</p>
      <div class="actions">
        <button class="btn" id="modal-cancel">${escapeHtml(cancelLabel)}</button>
        <button class="btn ${destructive?'btn-danger-solid':'btn-primary'}" id="modal-ok">${escapeHtml(confirmLabel)}</button>
      </div>
    </div></div>`;
  const close = () => $('#modal-root').innerHTML = '';
  $('#modal-cancel').addEventListener('click', close);
  $('#modal-bg').addEventListener('click', e => { if (e.target.id === 'modal-bg') close(); });
  $('#modal-ok').addEventListener('click', () => { close(); onConfirm && onConfirm(); });
}

// ----- Utils -----
function escapeAttr(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeHtml(s) { return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
let toastT;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400);
}
// ----- Auto-save indicator -----
// Two states: "Saving…" (while a debounce is in flight) and "Saved ✓" (after the write completes).
// The indicator persists for ~3s after the last save before fading.
function setSaveState(kind /* 'saving' | 'saved' | 'offline' */, msg) {
  const el = $('#save-ind'); if (!el) return;
  el.classList.remove('saving', 'saved', 'offline');
  el.classList.add(kind, 'on');
  el.textContent = msg || (kind === 'saving' ? 'Saving…' : kind === 'offline' ? 'Saved on this device' : 'Saved ✓');
  clearTimeout(setSaveState._t);
  if (kind !== 'saving') {
    setSaveState._t = setTimeout(() => el.classList.remove('on'), 3000);
  }
}
function markSaving() { setSaveState('saving'); }
function markSaved() { setSaveState('saved'); }
// Backwards-compat shim — older call sites still reference flashSaved
function flashSaved() { markSaved(); }
function formatDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
  catch { return iso; }
}
function structuredClone(obj) { return JSON.parse(JSON.stringify(obj)); }

// ----- Init -----
function showBootSpinner() {
  $('#main').innerHTML = `
    <div class="onboarding center" style="padding:60px 20px;">
      <div class="hero-mark" style="margin-bottom:18px;">Bible Sprint</div>
      <div class="spinner" aria-label="Loading" style="margin: 8px auto;"></div>
    </div>`;
}
function boot() {
  applyTheme();
  applyAccent();
  // If Firebase is configured we wait briefly for the auth state callback before the first render
  // so signed-in users don't see the guest FAB pop in then disappear. After ~700ms we render anyway
  // so a slow auth check never blocks the experience.
  if (isConfigured && auth) {
    let rendered = false;
    const safe = () => { if (!rendered) { rendered = true; render(); } };
    showBootSpinner();
    const fallback = setTimeout(safe, 700);
    onAuthStateChanged(auth, async user => {
      clearTimeout(fallback);
      if (user) {
        currentUser = user;
        authVisible = false;
        try { await hydrateFromFirestore(user.uid); } catch (e) { console.error(e); }
        syncCircleSubscriptions();
        // render()'s followingToday guard re-syncs state.viewDay to the real
        // progress data now that it's landed, regardless of whatever the
        // 700ms fallback (or a stale Firestore offline-cache read) painted first.
        rendered = true; render();
        scheduleReminder();
      } else {
        currentUser = null;
        if (userDocUnsub) { userDocUnsub(); userDocUnsub = null; }
        unsubscribeFromAllCircles();
        // Don't wipe state — keep the guest's local progress so they can carry on.
        rendered = true; render();
      }
    });
  } else {
    // No Firebase — pure local mode, render immediately.
    render();
  }
}

window.addEventListener('DOMContentLoaded', boot);

// =====================================================================
// PWA — service worker + install prompt
// =====================================================================
// Register the SW so the app shell + static assets cache for offline use.
// /sw.js controls the whole site (so home, about, contact, blog also cache).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}

// Install-prompt UX. Two paths:
//   • Android Chrome / desktop Chrome / Edge fire 'beforeinstallprompt' — capture and show our own banner.
//   • iOS Safari has no native prompt — detect iOS+Safari+not-installed and hint at the share menu.
// Either banner is dismissible and remembered in localStorage so it doesn't nag.
(function setupInstallPrompt() {
  const KEY = 'biblesprint:installBannerDismissed';
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) return;
  let dismissedAt = 0;
  try { dismissedAt = parseInt(localStorage.getItem(KEY) || '0', 10); } catch {}
  if (dismissedAt && Date.now() - dismissedAt < 14 * 24 * 60 * 60 * 1000) return;

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(() => showBanner('android'), 30000);
  });

  // Show the iOS banner for any iOS browser — Safari, Chrome (CriOS), Firefox (FxiOS), Edge (EdgiOS)
  // all use the same Add-to-Home flow because they're all WebKit underneath. Android browsers fire
  // beforeinstallprompt above and never reach this code.
  const ua = window.navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) && !window.MSStream;
  if (isIOS) setTimeout(() => showBanner('ios'), 30000);

  function dismiss() {
    try { localStorage.setItem(KEY, String(Date.now())); } catch {}
    document.getElementById('install-banner')?.remove();
  }

  function showBanner(kind) {
    if (document.getElementById('install-banner')) return;
    const wrap = document.createElement('div');
    wrap.id = 'install-banner';
    wrap.style.cssText = 'position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:60; max-width:380px; width:calc(100% - 32px); background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,0.18), 0 4px 12px rgba(0,0,0,0.08); padding:14px 16px; display:flex; align-items:center; gap:12px; font-size:14px; line-height:1.4; animation:install-pop 0.3s ease-out;';
    // Safari Share icon — square with an arrow pointing up. Inlined as SVG so users can see what to look for.
    const safariShareSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0; color:#007AFF; vertical-align:-4px; margin:0 2px;"><path d="M12 4v12"/><path d="M8 8l4-4 4 4"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg>`;
    const msg = kind === 'ios'
      ? `To install Bible Sprint, tap your <strong>browser's Share button</strong> ${safariShareSvg} (it's the square with an arrow pointing up — at the bottom of the screen in Safari, or in the menu in Chrome). Then scroll down and tap <strong>Add to Home Screen</strong>.`
      : 'Install Bible Sprint as an app on this device — adds it to your home screen.';
    wrap.innerHTML = `
      <div style="font-size:24px;" aria-hidden="true">📖</div>
      <div style="flex:1; min-width:0; color:var(--text);">${msg}</div>
      ${kind === 'android' ? '<button id="install-go" style="background:linear-gradient(135deg,#F472B6 0%,#F43F5E 50%,#FB923C 100%); color:white; border:none; border-radius:10px; padding:10px 14px; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0;">Install</button>' : ''}
      <button id="install-x" aria-label="Dismiss" style="background:transparent; border:none; color:var(--muted); font-size:20px; line-height:1; cursor:pointer; padding:4px 6px; flex-shrink:0;">×</button>
    `;
    document.body.appendChild(wrap);
    document.getElementById('install-x').addEventListener('click', dismiss);
    if (kind === 'android') {
      document.getElementById('install-go').addEventListener('click', async () => {
        if (!deferredPrompt) return dismiss();
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === 'accepted') document.getElementById('install-banner')?.remove();
        else dismiss();
      });
    }
    if (!document.getElementById('install-banner-style')) {
      const s = document.createElement('style');
      s.id = 'install-banner-style';
      s.textContent = '@keyframes install-pop { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }';
      document.head.appendChild(s);
    }
  }

  window.addEventListener('appinstalled', () => {
    document.getElementById('install-banner')?.remove();
    try { localStorage.setItem(KEY, String(Date.now())); } catch {}
  });
})();
</script>
